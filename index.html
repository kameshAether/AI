<title>Angry Birds — HTML Edition</title>

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #4ec0ca; font-family: 'Arial', sans-serif; }
  canvas { display: block; touch-action: none; }

"use strict";
// ============================================================
//  ANGRY BIRDS — single-file HTML5 game
//  Custom 2D physics (no libraries), drag-to-launch slingshot,
//  destructible wood/stone/glass blocks, pigs, scoring, levels.
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---------- world scale ----------
// Design in world units, scale to fit window.
const W = 1280, H = 720;
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  canvas.width = W * s; canvas.height = H * s;
  canvas.style.width = W * s + 'px';
  canvas.style.height = H * s + 'px';
  canvas.style.position = 'absolute';
  canvas.style.left = ((innerWidth - W * s) / 2) + 'px';
  canvas.style.top = ((innerHeight - H * s) / 2) + 'px';
  ctx.setTransform(s, 0, 0, s, 0, 0);
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);

// ---------- physics constants ----------
const GRAVITY = 0.35;
const RESTITUTION = 0.45;
const FRICTION = 0.992;
const GROUND_Y = 640;

// ---------- entity base ----------
let idCounter = 0;
class Body {
  constructor(x, y, w, h, opts = {}) {
    this.id = ++idCounter;
    this.x = x; this.y = y;           // center
    this.w = w; this.h = h;
    this.vx = 0; this.vy = 0;
    this.angle = opts.angle || 0;
    this.angVel = 0;
    this.static = !!opts.static;
    this.hp = opts.hp !== undefined ? opts.hp : 100;
    this.maxHp = this.hp;
    this.material = opts.material || 'wood';
    this.type = opts.type || 'block';
    this.alive = true;
    this.markedForSleep = false;
    this.onGround = false;
    this.sleep = false;
  }
  get mass() {
    const density = { wood: 0.8, glass: 0.6, stone: 2.4, bird: 1.6, pig: 1.0 }[this.material] || 1;
    return (this.w * this.h) * density / 1000;
  }
  damage(amount) {
    if (this.static) return;
    this.hp -= amount;
    if (this.hp <= 0) {
      this.alive = false;
      if (this.type === 'pig') {
        addScore(5000);
        spawnPoof(this.x, this.y);
        playSound('pigpop');
      } else if (this.type === 'tnt') {
        addScore(1000);
        // defer so the bodies list isn't mutated mid-collision loop
        pendingExplosions.push({ x: this.x, y: this.y });
      } else if (this.type === 'block') {
        addScore(500);
        spawnPoof(this.x, this.y);
        playSound(this.material + 'break');
      } else if (this.type === 'bird') {
        // bird just becomes inert
      }
    }
  }
  update() {
    if (this.static || this.sleep || !this.alive) return;
    this.vy += GRAVITY;
    this.vx *= FRICTION; this.vy *= FRICTION;
    this.x += this.vx; this.y += this.vy;
    this.angle += this.angVel;
    this.angVel *= 0.995;
    // ground
    if (this.y + this.h / 2 > GROUND_Y) {
      this.y = GROUND_Y - this.h / 2;
      const impact = Math.abs(this.vy);
      if (impact > 2.2) {
        this.damage(impact * this.mass * 4);
        spawnDust(this.x, GROUND_Y);
      }
      if (Math.abs(this.vy) > 0.5) playSound('thud');
      this.vy = -this.vy * RESTITUTION * 0.6;
      // rolling friction (horizontal): much gentler than the old 0.9 kill
      const rollFriction = this.type === 'bird' ? 0.995 : 0.97;
      this.vx *= rollFriction; this.angVel *= 0.8;
      if (Math.abs(this.vy) < 0.6) this.vy = 0;
      this.onGround = true;
    } else this.onGround = false;
    // egg explodes on first ground/structure contact
    if (this.type === 'egg' && this.onGround && !this.eggDone) {
      this.eggDone = true;
      this.alive = false;
      pendingExplosions.push({ x: this.x, y: this.y });
    }
    // walls
    if (this.x - this.w / 2 < 0) { this.x = this.w / 2; this.vx = Math.abs(this.vx) * 0.5; }
    if (this.x + this.w / 2 > W) { this.x = W - this.w / 2; this.vx = -Math.abs(this.vx) * 0.5; }
    if (this.y - this.h / 2 < -400) { this.y = -400 + this.h / 2; this.vy = Math.abs(this.vy) * 0.3; }
    // sleep
    if (this.onGround && Math.abs(this.vx) < 0.08 && Math.abs(this.vy) < 0.08 && Math.abs(this.angVel) < 0.002) {
      this.sleepTimer = (this.sleepTimer || 0) + 1;
      if (this.sleepTimer > 30) { this.sleep = true; this.angle = 0; this.angVel = 0; }
    } else this.sleepTimer = 0;
  }
}

// ---------- collision (rotated AABB via circle approximation + SAT-lite) ----------
function collide(a, b) {
  if (!a.alive || !b.alive) return;
  if ((a.sleep || a.static) && (b.sleep || b.static)) return;
  // quick reject
  const rr = (Math.max(a.w, a.h) + Math.max(b.w, b.h)) / 2 + 10;
  if (dist(a.x, a.y, b.x, b.y) > rr) return;

  // approximate with axis-aligned boxes (angles are visual mostly; keeps stable)
  const dx = b.x - a.x, dy = b.y - a.y;
  const px = (a.w / 2 + b.w / 2) - Math.abs(dx);
  const py = (a.h / 2 + b.h / 2) - Math.abs(dy);
  if (px <= 0 || py <= 0) return;

  const ma = a.static ? 1e9 : (a.sleep ? 1e9 : a.mass);
  const mb = b.static ? 1e9 : (b.sleep ? 1e9 : b.mass);
  const total = ma + mb;
  const relVx = b.vx - a.vx, relVy = b.vy - a.vy;

  // resolve along axis of least penetration
  // wake sleepers on contact
  a.sleep = false; a.sleepTimer = 0;
  b.sleep = false; b.sleepTimer = 0;
  if (px < py) {
    const dir = dx > 0 ? 1 : -1;
    const overlap = px;
    const impact = Math.abs(relVx);
    a.x -= dir * overlap * (mb / total);
    b.x += dir * overlap * (ma / total);
    const j = -relVx * (RESTITUTION + 0.55);
    if (!a.static && !a.sleep) { a.vx -= (j * mb / total); }
    if (!b.static && !b.sleep) { b.vx += (j * ma / total); }
    applyImpactDamage(a, b, impact);
  } else {
    const dir = dy > 0 ? 1 : -1;
    const overlap = py;
    const impact = Math.abs(relVy);
    a.y -= dir * overlap * (mb / total);
    b.y += dir * overlap * (ma / total);
    const j = -relVy * (RESTITUTION + 0.55);
    if (!a.static && !a.sleep) { a.vy -= (j * mb / total); }
    if (!b.static && !b.sleep) { b.vy += (j * ma / total); }
    applyImpactDamage(a, b, impact);
  }
  // spin
  const spin = (Math.abs(relVx) + Math.abs(relVy)) * 0.004;
  if (!a.static && !a.sleep) a.angVel += (Math.random() - 0.5) * spin;
  if (!b.static && !b.sleep) b.angVel += (Math.random() - 0.5) * spin;
}

function applyImpactDamage(a, b, impact) {
  if (impact < 2.5) return;
  const energy = impact * Math.min(a.mass, b.mass);
  // birds hurt everything a lot
  if (a.type === 'bird' && b.type !== 'bird') b.damage(energy * 5.5);
  if (b.type === 'bird' && a.type !== 'bird') a.damage(energy * 5.5);
  if (a.type === 'block' && b.type !== 'bird') b.damage(energy * 0.35);
  if (b.type === 'block' && a.type !== 'bird') a.damage(energy * 0.35);
  if (impact > 4) playSound('hit');
}

const SAVE_KEY = 'ab_save_v1';
function getSave() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || { stars: {}, unlocked: 1 }; }

}
function setSave(s) { try { localStorage.setItem(SAVE_KEY, JSON.stringify(s)); } catch (e) {} }

let extraBirds = [];       // split birds / eggs in flight
let shakeTime = 0, shakeMag = 0;
let pendingExplosions = []; // TNT queued to detonate (chain-safe)
function addShake(mag, time) { shakeMag = Math.max(shakeMag, mag); shakeTime = Math.max(shakeTime, time); }

// ---------- explosions ----------
function explode(x, y, radius, power) {
  addShake(12, 25);
  playSound('stonebreak');
  spawnPoof(x, y);
  for (let i = 0; i < 24; i++) {
    const a = (Math.PI * 2 / 24) * i;
    particles.push({ x, y, vx: Math.cos(a) * rand(2, 6), vy: Math.sin(a) * rand(2, 6), life: 32,
      color: `rgba(255,${Math.round(rand(120, 220))},40,${rand(0.6, 0.9)})`, r: rand(5, 12), type: 'fire' });
  }
  for (const b of bodies) {
    if (!b.alive || b.static) continue;
    const d = dist(x, y, b.x, b.y);
    if (d < radius) {
      const falloff = 1 - d / radius;
      b.sleep = false; b.sleepTimer = 0;
      const ang = Math.atan2(b.y - y, b.x - x);
      b.vx += Math.cos(ang) * power * falloff;
      b.vy += Math.sin(ang) * power * falloff - 2 * falloff;
      if (b.type !== 'bird') b.damage(120 * falloff);
    }
  }
}

// ---------- sounds (WebAudio, no files) ----------
let audioCtx = null;
function ensureAudio() {
  if (!audioCtx) try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(name) {
  if (!audioCtx || muted) return;
  const t = audioCtx.currentTime;
  const g = audioCtx.createGain();
  g.connect(audioCtx.destination);
  if (name === 'launch') {
    const o = audioCtx.createOscillator();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(600, t + 0.18);
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    o.connect(g); o.start(t); o.stop(t + 0.2);
  } else if (name === 'woodbreak' || name === 'hit') {
    const buf = audioCtx.createBuffer(1, 2000, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = name === 'hit' ? 900 : 500;
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
    src.connect(f); f.connect(g); src.start(t);
  } else if (name === 'glassbreak') {
    const buf = audioCtx.createBuffer(1, 3000, audioCtx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3000;
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    src.connect(f); f.connect(g); src.start(t);
  } else if (name === 'stonebreak' || name === 'thud') {

// ---------- score ----------
function addScore(n) { score += n; }

// ---------- level loading ----------
const MATERIAL_HP = { wood: 110, glass: 55, stone: 260, tnt: 40 };
function loadLevel(i) {
  const L = LEVELS[i];
  bodies = []; particles = []; currentBird = null; extraBirds = [];
  shotsThisLevel = 0;
  birdsQueue = [];
  if (L.birdList) {
    for (const t of L.birdList) birdsQueue.push(t);
  } else {
    for (let b = 0; b < L.birds; b++) birdsQueue.push(['red', 'yellow', 'blue', 'black', 'white'][b % 5]);
  }
  for (const s of L.structures) {
    if (s.type === 'pig') {
      bodies.push(new Body(s.x, s.y, s.r * 2 * 0.85, s.r * 2 * 0.85, { material: 'pig', type: 'pig', hp: 55 + s.r }));
    } else {
      bodies.push(new Body(s.x, s.y, s.w, s.h, { material: s.material, type: s.type || 'block', hp: MATERIAL_HP[s.material] * (s.w * s.h) / 1600 }));
    }
  }
  nextBird();
  gameState = 'aiming';
  cameraTargetX = 0; cameraX = 0;
}
function nextBird() {
  // remove the previous bird from the physics world
  if (currentBird) bodies = bodies.filter(b => b !== currentBird);
  if (birdsQueue.length === 0) { currentBird = null; return; }
  // return camera to the slingshot for the next shot
  cameraTargetX = 0;
  const typeKey = birdsQueue.shift();
  const bt = BIRD_TYPES[typeKey] || BIRD_TYPES.red;
  currentBird = new Body(SLING.armX, SLING.armY, bt.ability === 'split' ? 26 : 34, bt.ability === 'split' ? 26 : 34, { material: 'bird', type: 'bird', hp: 99999 });
  currentBird.color = bt.color;
  currentBird.birdType = typeKey;
  currentBird.ability = bt.ability;
  currentBird.launched = false;
  currentBird.trail = [];
  bodies.push(currentBird); // bird participates in physics + collisions
  gameState = 'aiming';
}

let dragging = false;

canvas.addEventListener('pointermove', e => {
  if (!dragging) return;
  const p = canvasPos(e);
  let dx = p.x - SLING.armX, dy = p.y - SLING.armY;
  const d = Math.hypot(dx, dy);
  if (d > SLING.maxPull) { dx *= SLING.maxPull / d; dy *= SLING.maxPull / d; }
  dragX = SLING.armX + dx; dragY = SLING.armY + dy;
  currentBird.x = dragX; currentBird.y = dragY;

canvas.addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false;
  const dx = SLING.armX - currentBird.x;
  const dy = SLING.armY - currentBird.y;
  const power = Math.hypot(dx, dy);
  if (power < 12) { currentBird.x = SLING.armX; currentBird.y = SLING.armY; return; }
  const speed = clamp(power * 0.16, 3, 15);
  currentBird.vx = (dx / power) * speed;
  currentBird.vy = (dy / power) * speed;

let flyTimer = 0;

// tap while flying = activate bird ability

    const a = currentBird.ability;
    if (a === 'none') return;
    currentBird.abilityUsed = true;
    if (a === 'dash') {
      // speed boost along current heading
      const sp = Math.hypot(currentBird.vx, currentBird.vy) || 1;
      currentBird.vx = (currentBird.vx / sp) * Math.min(sp * 1.9, 24);
      currentBird.vy = (currentBird.vy / sp) * Math.min(sp * 1.9, 24);
      spawnFeathers(currentBird.x, currentBird.y, 8);
      playSound('launch');
    } else if (a === 'split') {
      // spawn two extra birds fanning out
      for (const ang of [-0.35, 0.35]) {
        const sp = Math.hypot(currentBird.vx, currentBird.vy);
        const cur = Math.atan2(currentBird.vy, currentBird.vx);
        const nb = new Body(currentBird.x, currentBird.y, 26, 26, { material: 'bird', type: 'bird', hp: 99999 });
        nb.color = currentBird.color; nb.birdType = 'blue'; nb.ability = 'none'; nb.abilityUsed = true;
        nb.launched = true; nb.trail = [];
        nb.vx = Math.cos(cur + ang) * sp;
        nb.vy = Math.sin(cur + ang) * sp;

      playSound('launch');
    } else if (a === 'bomb') {
      // detonate immediately
      const bx = currentBird.x, by = currentBird.y;
      currentBird.alive = false;

      egg.vx = currentBird.vx * 0.2; egg.vy = Math.max(currentBird.vy, 0) + 3;
      egg.color = '#f5f5f5'; egg.launched = true; egg.isEgg = true;

// ---------- update ----------
function update() {
  pendingExplosions = []; // reset each frame; damage() may queue new ones
  // physics
  for (const b of bodies) {
    if (b === currentBird && !currentBird.launched) continue; // bird waits on the sling
    b.update();
  }
  for (let i = 0; i < bodies.length; i++)
    for (let j = i + 1; j < bodies.length; j++)
      collide(bodies[i], bodies[j]);
  bodies = bodies.filter(b => b.alive);
  // detonate queued TNT (may chain-queue more — process until stable, max 8)
  let guard = 0;
  while (pendingExplosions.length && guard++ < 8) {
    const ex = pendingExplosions.shift();
    explode(ex.x, ex.y, 140, 10);
    bodies = bodies.filter(b => b.alive);
  }
  updateParticles();

  // camera follows bird
  if (gameState === 'flying' && currentBird) {
    cameraTargetX = clamp(currentBird.x - 400, 0, 400);
    if (currentBird.y > H + 200) endFlight();
  }
  cameraX += (cameraTargetX - cameraX) * 0.08;

  // trail
  if (gameState === 'flying' && currentBird) {
    currentBird.trail.push({ x: currentBird.x, y: currentBird.y });
    if (currentBird.trail.length > 40) currentBird.trail.shift();
  }

  // flight settle detection — also wait for split birds / eggs
  if (gameState === 'flying') {
    flyTimer++;
    // bomb auto-detonates shortly after landing
    if (currentBird && currentBird.birdType === 'black' && !currentBird.abilityUsed && currentBird.onGround) {
      currentBird.abilityUsed = true;
      const bx = currentBird.x, by = currentBird.y;
      currentBird.alive = false;
      explode(bx, by, 150, 11);
    }
    const extrasActive = extraBirds.some(b => b.alive && !b.sleep && (Math.abs(b.vx) > 0.4 || Math.abs(b.vy) > 0.4));
    const birdGone = !currentBird || !currentBird.alive || bodies.indexOf(currentBird) === -1;
    const birdSlow = (birdGone || currentBird.sleep || (Math.abs(currentBird.vx) < 0.4 && Math.abs(currentBird.vy) < 0.6 && currentBird.onGround)) && !extrasActive;
    if ((birdSlow && flyTimer > 40) || flyTimer > 420 || !currentBird) {
      gameState = 'settling';
      settleTimer = 0;
    }
  } else if (gameState === 'settling') {
    settleTimer++;
    const calm = bodies.every(b => b.sleep || b.static || (Math.abs(b.vx) < 0.3 && Math.abs(b.vy) < 0.3));
    if (settleTimer > 100 || (settleTimer > 35 && calm)) {
      const pigsLeft = bodies.filter(b => b.type === 'pig').length;
      if (pigsLeft === 0) {
        gameState = 'win';
        // bonus for remaining birds
        const bonus = birdsQueue.length * 10000;
        if (bonus > 0) { addScore(bonus); }
        const totalBirds = LEVELS[levelIndex].birdList ? LEVELS[levelIndex].birdList.length : LEVELS[levelIndex].birds;
        stars = clamp(Math.floor(birdsQueue.length / totalBirds * 3) + 1, 1, 3);
        // persist progress
        const save = getSave();
        if (!save.stars) save.stars = {};
        save.stars[levelIndex] = Math.max(save.stars[levelIndex] || 0, stars);
        save.unlocked = Math.max(save.unlocked || 1, levelIndex + 2);
        setSave(save);
        playSound('win');
      } else if (birdsQueue.length === 0) {
        gameState = 'lose';
      } else {
        extraBirds = [];
        nextBird();
      }
    }
  }
  // screen shake decay
  if (shakeTime > 0) { shakeTime--; if (shakeTime === 0) shakeMag = 0; }
}

function endFlight() {
  if (gameState === 'flying') {
    gameState = 'settling';
    settleTimer = 60; // quick settle since bird is gone
  }
}

function drawSky() {

  else if (theme === 'sunset') { g.addColorStop(0, '#f7b733'); g.addColorStop(0.6, '#fc6076'); g.addColorStop(1, '#f8b26a'); }
  else { g.addColorStop(0, '#0f1b33'); g.addColorStop(1, '#2c3e6b'); }

  if (theme === 'night') {
    // stars

      ctx.fillStyle = `rgba(255,255,255,${0.3 + 0.5 * Math.sin(Date.now() / 500 + i)})`;

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.3, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.3, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(-r * 0.35, -r * 0.3, r * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.35, -r * 0.3, r * 0.1, 0, Math.PI * 2); ctx.fill();
  // ears
  ctx.fillStyle = '#5aa832';
  ctx.beginPath(); ctx.arc(-r * 0.6, -r * 0.75, r * 0.22, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(r * 0.6, -r * 0.75, r * 0.22, 0, Math.PI * 2); ctx.fill();
  // bruise when hurt
  if (hurtRatio < 0.5) {
    ctx.fillStyle = 'rgba(80,40,80,0.35)';
    ctx.beginPath(); ctx.arc(r * 0.4, r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill();
  }
}
function drawBlock(b) {
  const m = b.material;
  const hurtRatio = clamp(b.hp / b.maxHp, 0, 1);
  ctx.save();
  if (m === 'wood') {
    ctx.fillStyle = '#c8873c';
    ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    ctx.strokeStyle = '#a06828'; ctx.lineWidth = 2;
    ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
    // grain
    ctx.strokeStyle = 'rgba(140,90,40,0.5)'; ctx.lineWidth = 1;
    if (b.h > b.w) {
      for (let i = 1; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(-b.w / 2 + (b.w / 3) * i, -b.h / 2 + 4); ctx.lineTo(-b.w / 2 + (b.w / 3) * i, b.h / 2 - 4); ctx.stroke();
      }
    } else {
      for (let i = 1; i < 3; i++) {
        ctx.beginPath(); ctx.moveTo(-b.w / 2 + 4, -b.h / 2 + (b.h / 3) * i); ctx.lineTo(b.w / 2 - 4, -b.h / 2 + (b.h / 3) * i); ctx.stroke();
      }
    }
  } else if (m === 'glass') {
    ctx.fillStyle = 'rgba(160,220,255,0.55)';
    ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    ctx.strokeStyle = 'rgba(120,190,235,0.9)'; ctx.lineWidth = 2;
    ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-b.w / 2 + 5, -b.h / 2 + b.h * 0.8); ctx.lineTo(b.w / 2 - 8, -b.h / 2 + 4); ctx.stroke();
  } else { // stone
    ctx.fillStyle = '#9aa0a6';
    ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
    ctx.strokeStyle = '#7c8288'; ctx.lineWidth = 2;
    ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
    // rivets
    ctx.fillStyle = '#7c8288';
    const inset = 6;
    [[-1, -1], [1, -1], [-1, 1], [1, 1]].forEach(([sx, sy]) => {
      ctx.beginPath();
      ctx.arc(sx * (b.w / 2 - inset), sy * (b.h / 2 - inset), 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
  }
  // damage cracks
  if (hurtRatio < 0.7) {
    ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-b.w * 0.3, -b.h * 0.3);
    ctx.lineTo(0, 0); ctx.lineTo(-b.w * 0.15, b.h * 0.35);
    if (hurtRatio < 0.35) { ctx.moveTo(b.w * 0.3, -b.h * 0.2); ctx.lineTo(b.w * 0.1, b.h * 0.1); ctx.lineTo(b.w * 0.35, b.h * 0.3); }
    ctx.stroke();
  }
  ctx.restore();
}
function drawTNT(b) {
  // red crate with TNT label + fuse
  ctx.fillStyle = '#c0392b';
  ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h);
  ctx.strokeStyle = '#8b2a1e'; ctx.lineWidth = 2.5;
  ctx.strokeRect(-b.w / 2, -b.h / 2, b.w, b.h);
  // plank cross
  ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-b.w / 2 + 5, -b.h / 2 + 5); ctx.lineTo(b.w / 2 - 5, b.h / 2 - 5);
  ctx.moveTo(b.w / 2 - 5, -b.h / 2 + 5); ctx.lineTo(-b.w / 2 + 5, b.h / 2 - 5);
  ctx.stroke();
  // label
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(b.w * 0.34)}px Arial`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('TNT', 0, 1);
  ctx.textBaseline = 'alphabetic';
  // spark when idle
  if (Math.floor(Date.now() / 400) % 2 === 0) {
    ctx.fillStyle = '#ffe066';
    ctx.beginPath(); ctx.arc(b.w / 2 - 4, -b.h / 2 - 4, 3, 0, Math.PI * 2); ctx.fill();
  }
}
function drawParticles() {
  for (const p of particles) {
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
}
function drawTrajectoryHint() {
  if (currentBird && !currentBird.launched && dragging) {
    const dx = SLING.armX - currentBird.x, dy = SLING.armY - currentBird.y;
    const power = Math.hypot(dx, dy);
    if (power < 12) return;
    const speed = clamp(power * 0.16, 3, 15);
    let px = currentBird.x, py = currentBird.y;
    let vx = (dx / power) * speed, vy = (dy / power) * speed;
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    for (let i = 0; i < 60; i++) {
      vy += GRAVITY; px += vx; py += vy;
      if (i % 5 === 0) { ctx.beginPath(); ctx.arc(px, py, 2.5, 0, Math.PI * 2); ctx.fill(); }
      if (py > GROUND_Y) break;
    }
  }
}
function drawUI() {
  // score
  ctx.font = 'bold 28px Arial';
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = 'rgba(0,0,0,0.4)'; ctx.lineWidth = 4;
  ctx.textAlign = 'left';
  ctx.strokeText(`SCORE: ${score}`, 30, 50);
  ctx.fillText(`SCORE: ${score}`, 30, 50);
  // level
  ctx.textAlign = 'center';
  ctx.strokeText(`Level ${levelIndex + 1}/${LEVELS.length}: ${LEVELS[levelIndex].name}`, W / 2, 50);
  ctx.fillText(`Level ${levelIndex + 1}/${LEVELS.length}: ${LEVELS[levelIndex].name}`, W / 2, 50);
  // birds left (mini icons)
  const totalLeft = birdsQueue.length + (currentBird && !currentBird.launched ? 1 : 0);
  for (let i = 0; i < totalLeft; i++) {
    const bx = W - 40 - i * 40, by = 40;
    const key = (currentBird && !currentBird.launched && i === totalLeft - 1) ? currentBird.birdType : birdsQueue[totalLeft - 1 - i];
    const bt = BIRD_TYPES[key] || BIRD_TYPES.red;
    ctx.save();
    ctx.translate(bx, by);
    drawBird({ w: 26, color: bt.color, birdType: key });
    ctx.restore();
  }
  // pigs left
  const pigs = bodies.filter(b => b.type === 'pig').length;
  ctx.textAlign = 'right';
  ctx.font = 'bold 26px Arial';
  ctx.strokeText(`🐷 ${pigs}`, W - 30, 90);
  ctx.fillText(`🐷 ${pigs}`, W - 30, 90);
  // current bird ability hint
  if (currentBird && !currentBird.launched && currentBird.ability !== 'none' && gameState === 'aiming') {
    const hints = { dash: 'Chuck: tap mid-flight to DASH', split: 'Blues: tap mid-flight to SPLIT', bomb: 'Bomb: tap mid-flight to EXPLODE', egg: 'Matilda: tap mid-flight to DROP EGG' };
    ctx.textAlign = 'center';
    ctx.font = '22px Arial';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.strokeText(hints[currentBird.ability], W / 2, 90);
    ctx.fillText(hints[currentBird.ability], W / 2, 90);
  }

  // HUD buttons
  if (gameState !== 'menu') {
    for (const btn of HUD_BTNS()) {
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.roundRect(btn.x, btn.y, btn.w, btn.h, 10); ctx.fill();
      ctx.font = '24px Arial'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
      ctx.fillText(btn.label, btn.x + btn.w / 2, btn.y + btn.h / 2 + 8);
    }
  }

  if (gameState === 'menu') drawMenu();
  if (gameState === 'win') drawEndScreen(true);
  if (gameState === 'lose') drawEndScreen(false);
}
function drawMenu() {
  ctx.fillStyle = 'rgba(20,40,60,0.92)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 64px Arial';
  ctx.fillStyle = '#ffd93d';
  ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 6;
  ctx.strokeText('ANGRY BIRDS', W / 2, 130);
  ctx.fillText('ANGRY BIRDS', W / 2, 130);
  ctx.font = '24px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText('Select a level', W / 2, 180);

  const save = getSave();
  const cols = 3, cw = 220, ch = 110, x0 = (W - cols * cw) / 2, y0 = 240;
  for (let i = 0; i < LEVELS.length; i++) {
    const cx = x0 + (i % cols) * cw, cy = y0 + Math.floor(i / cols) * ch;
    const unlocked = i < save.unlocked;
    ctx.fillStyle = unlocked ? 'rgba(255,255,255,0.12)' : 'rgba(255,255,255,0.04)';
    ctx.strokeStyle = unlocked ? 'rgba(255,217,61,0.8)' : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.roundRect(cx + 10, cy + 10, cw - 20, ch - 20, 14); ctx.fill(); ctx.stroke();
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = unlocked ? '#fff' : 'rgba(255,255,255,0.3)';
    ctx.fillText(`${i + 1}. ${LEVELS[i].name}`, cx + cw / 2, cy + 48);
    if (unlocked) {
      const st = save.stars && save.stars[i] ? save.stars[i] : 0;
      for (let s = 0; s < 3; s++) drawStar(cx + cw / 2 - 40 + s * 40, cy + 78, 13, s < st);
    } else {
      ctx.font = '26px Arial';
      ctx.fillText('🔒', cx + cw / 2, cy + 80);
    }
  }
  // total stars
  const total = Object.values(save.stars || {}).reduce((a, b) => a + b, 0);
  ctx.font = '26px Arial';
  ctx.fillStyle = '#ffd93d';
  ctx.fillText(`⭐ ${total} / ${LEVELS.length * 3}`, W / 2, H - 40);
}
function drawEndScreen(win) {
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center';
  ctx.font = 'bold 72px Arial';
  ctx.fillStyle = win ? '#ffd93d' : '#ff6b6b';
  ctx.fillText(win ? 'LEVEL CLEARED!' : 'LEVEL FAILED', W / 2, H / 2 - 60);
  if (win) {
    // stars
    for (let i = 0; i < 3; i++) {
      const filled = i < stars;
      drawStar(W / 2 - 90 + i * 90, H / 2 + 10, 32, filled);
    }
  } else {
    ctx.font = '28px Arial';
    ctx.fillStyle = '#fff';
    ctx.fillText('The pigs survived...', W / 2, H / 2);
  }
  ctx.font = '26px Arial';
  ctx.fillStyle = '#fff';
  ctx.fillText(
    levelIndex + 1 < LEVELS.length
      ? (win ? 'Tap for next level' : 'Tap to retry')
      : (win ? 'You beat all levels! Tap to play again' : 'Tap to retry'),
    W / 2, H / 2 + 100
  );
}
function drawStar(x, y, r, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a1 = (Math.PI * 2 / 5) * i - Math.PI / 2;
    const a2 = a1 + Math.PI / 5;
    ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
    ctx.lineTo(Math.cos(a2) * r * 0.45, Math.sin(a2) * r * 0.45);
  }
  ctx.closePath();
  if (filled) { ctx.fillStyle = '#ffd93d'; ctx.fill(); ctx.strokeStyle = '#b8860b'; }
  else { ctx.fillStyle = 'rgba(255,255,255,0.15)'; ctx.fill(); ctx.strokeStyle = 'rgba(255,255,255,0.4)'; }
  ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();
}
function drawWaitingBirds() {
  // birds queued behind slingshot
  for (let i = 0; i < birdsQueue.length; i++) {
    const x = SLING.x - 60 - i * 42;
    const bob = Math.sin(Date.now() / 300 + i * 1.3) * 3;
    ctx.save();
    ctx.translate(x, GROUND_Y - 17 + bob);
    const bt = BIRD_TYPES[birdsQueue[i]] || BIRD_TYPES.red;
    const fakeBird = { w: 30, color: bt.color, birdType: birdsQueue[i] };
    drawBird(fakeBird);
    ctx.restore();
  }
}

// ---------- main loop ----------
function render() {
  ctx.save();
  // screen shake
  let shx = 0, shy = 0;
  if (shakeTime > 0) { shx = rand(-shakeMag, shakeMag); shy = rand(-shakeMag, shakeMag); }
  ctx.translate(shx, shy);
  drawSky();
  ctx.save();
  ctx.translate(-cameraX, 0);
  drawGround();
  drawSlingshot();
  for (const b of bodies) if (b !== currentBird || currentBird.launched) drawBody(b);
  // bird trail
  if (currentBird && currentBird.trail.length > 1 && currentBird.launched) {
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(currentBird.trail[0].x, currentBird.trail[0].y);
    for (const t of currentBird.trail) ctx.lineTo(t.x, t.y);
    ctx.stroke();
  }
  if (currentBird && !currentBird.launched) drawBody(currentBird);
  drawTrajectoryHint();
  drawSlingshotFront();
  drawParticles();
  drawWaitingBirds();
  ctx.restore();
  drawUI();
  ctx.restore();
}

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}

// boot to level-select menu (skip physics while in menu)
gameState = 'menu';
loop();
</script>
</body>
</html>
